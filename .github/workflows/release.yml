# Veröffentlicht eine Version: Tag "v0.1.0" pushen (oder hier manuell starten),
# dann baut der Workflow die signierte APK (Variante "eigen") und hängt sie an ein GitHub-Release.
# Voraussetzung: die vier SIGNING_*-Secrets (siehe ENTWICKLUNG.md, "Release").
# Die Variante "travic" wird nicht veröffentlicht (keine Erlaubnis der Betreiber).
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag der Version, z. B. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Signatur-Secrets prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt. Ohne festen Schlüssel lassen sich Updates nicht installieren."
            exit 1
          fi

      - name: Tests und signierte APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew testEigenDebugUnitTest assembleEigenRelease --no-daemon
          cp app/build/outputs/apk/eigen/release/app-eigen-release.apk "pendelblick-$TAG.apk"
          # Zusätzlich unter festem Namen, damit .../releases/latest/download/pendelblick.apk immer funktioniert.
          cp app/build/outputs/apk/eigen/release/app-eigen-release.apk pendelblick.apk

      - name: Text für die Release-Seite
        run: |
          cat > notes.md <<EOF
          Dir hilft die App? Über Ko-fi kannst du mir einen Kaffee ausgeben:

          [![Unterstütze Slashir auf Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/slashir)

          ## Installation

          1. Unten unter **Assets** auf \`pendelblick-$TAG.apk\` tippen und herunterladen.
          2. Datei öffnen. Android fragt einmal, ob der Browser Apps installieren darf: erlauben.
          3. In der App deine Fahrt anlegen: Start, Ziel und Verbindung wählen, Benachrichtigungen erlauben.

          Updates installieren sich über die bisherige Version, deine Fahrten bleiben erhalten.
          Mehr zur App: https://github.com/${{ github.repository }}
          EOF

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versionen vor 1.0 erscheinen als Vorabversion.
          PRE=""
          case "$TAG" in v0.*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "pendelblick-$TAG.apk" pendelblick.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "pendelblick-$TAG.apk" pendelblick.apk --title "Pendelblick $TAG" \
              --notes-file notes.md --generate-notes --target "$GITHUB_SHA" $PRE
          fi
