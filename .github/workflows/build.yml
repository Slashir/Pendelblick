name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit-Tests
        run: ./gradlew testEigenDebugUnitTest

      - name: Beide Varianten bauen
        run: ./gradlew assembleTravicDebug assembleEigenDebug

      - uses: actions/upload-artifact@v7
        with:
          name: pendelblick-apks
          path: app/build/outputs/apk/**/*.apk

  probe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests des Python-Testskripts
        working-directory: tools
        run: python3 -m unittest test_probe.py -v
